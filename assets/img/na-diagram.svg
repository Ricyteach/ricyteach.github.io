<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-label="Three-panel diagram of a cracked reinforced concrete section. Left panel: rectangular cross-section with compression zone shaded above the neutral axis and cracked zone outlined below, steel bar at bottom. Middle panel: linear strain profile, a single straight line from compressive strain at top through zero at the neutral axis to tensile strain at the steel. Right panel: stress diagram with rectangular compression block above the neutral axis, blank cracked zone below, and tension force arrow at steel level.">
  <style>
    .lbl { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 11px; fill: #1A1C20; }
    .dim { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 10px; fill: #585E66; }
    .na  { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 10px; fill: #143C5E; }
  </style>

  <!-- ============================================================
       Panel headers
       ============================================================ -->
  <text x="90"  y="16" text-anchor="middle" class="dim">section</text>
  <text x="258" y="16" text-anchor="middle" class="dim">strain</text>
  <text x="415" y="16" text-anchor="middle" class="dim">stress</text>

  <!-- ============================================================
       Common Y coordinates
       y_top  = 28  (top of section)
       y_na   = 130 (neutral axis; c = 102)
       y_s    = 258 (steel level; d = 230)
       y_bot  = 270 (bottom edge label zone)
       ============================================================ -->

  <!-- ============================================================
       Panel 1 - Cross-section  (x: 40 - 140, center 90)
       ============================================================ -->

  <!-- Compression zone: filled light gray -->
  <rect x="40" y="28" width="100" height="102" fill="#E4E3DD" stroke="#1A1C20" stroke-width="1.25"/>

  <!-- Cracked (tension) zone: dashed outline, no fill -->
  <rect x="40" y="130" width="100" height="128" fill="none" stroke="#1A1C20" stroke-width="1.25" stroke-dasharray="5 3"/>

  <!-- Steel reinforcing bar -->
  <circle cx="90" cy="258" r="7" fill="#1A1C20"/>

  <!-- Neutral axis line (accent) -->
  <line x1="25" y1="130" x2="155" y2="130" stroke="#143C5E" stroke-width="1.75"/>

  <!-- Dimension: b (width, below section) -->
  <line x1="40" y1="282" x2="140" y2="282" stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="40" y1="278" x2="40" y2="286" stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="140" y1="278" x2="140" y2="286" stroke="#1A1C20" stroke-width="0.75"/>
  <text x="90" y="290" text-anchor="middle" class="lbl">b</text>

  <!-- Dimension: c (right side, top to NA) -->
  <line x1="148" y1="28"  x2="158" y2="28"  stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="148" y1="130" x2="158" y2="130" stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="153" y1="28"  x2="153" y2="130" stroke="#1A1C20" stroke-width="0.75"/>
  <text x="162" y="83"  dominant-baseline="middle" class="lbl">c</text>

  <!-- Dimension: d (left side, full effective depth) -->
  <line x1="26" y1="28"  x2="36" y2="28"  stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="26" y1="258" x2="36" y2="258" stroke="#1A1C20" stroke-width="0.75"/>
  <line x1="31" y1="28"  x2="31" y2="258" stroke="#1A1C20" stroke-width="0.75"/>
  <text x="19" y="143" dominant-baseline="middle" text-anchor="middle" class="lbl">d</text>

  <!-- As label under steel bar -->
  <text x="90" y="278" text-anchor="middle" class="dim">As</text>

  <!-- Panel 2 - Strain (vertical axis x=258, y: 28-270)
       Strain line from (236,28) to (286,258) crosses axis x=258 at y=130. -->

  <!-- Vertical reference axis -->
  <line x1="258" y1="22" x2="258" y2="272" stroke="#1A1C20" stroke-width="0.75"/>

  <!-- Continuous linear strain profile (single straight line) -->
  <line x1="236" y1="28" x2="286" y2="258" stroke="#1A1C20" stroke-width="1.75"/>

  <!-- Dot on neutral axis -->
  <circle cx="258" cy="130" r="3" fill="#143C5E"/>

  <!-- Neutral axis dashed guide -->
  <line x1="220" y1="130" x2="310" y2="130" stroke="#143C5E" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Strain labels -->
  <text x="230" y="32"  text-anchor="end" class="lbl">&#x03B5;c</text>
  <text x="262" y="134" dominant-baseline="middle" class="na">0</text>
  <text x="290" y="262" class="lbl">&#x03B5;s</text>

  <!-- ============================================================
       Panel 3 - Stress  (vertical axis x=390, y: 28-270)
       ============================================================ -->

  <!-- Vertical reference axis -->
  <line x1="390" y1="22" x2="390" y2="272" stroke="#1A1C20" stroke-width="0.75"/>

  <!-- Compression stress block (rectangular, Whitney) -->
  <rect x="350" y="28" width="40" height="102" fill="#E4E3DD" stroke="#1A1C20" stroke-width="1.25"/>

  <!-- Neutral axis dashed guide -->
  <line x1="335" y1="130" x2="460" y2="130" stroke="#143C5E" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Tension force arrow at steel level -->
  <line x1="390" y1="258" x2="425" y2="258" stroke="#1A1C20" stroke-width="1.75"/>
  <polygon points="425,258 418,254 418,262" fill="#1A1C20"/>

  <!-- Labels: C and T -->
  <text x="346" y="83"  text-anchor="end" dominant-baseline="middle" class="lbl">C</text>
  <text x="430" y="262" dominant-baseline="middle" class="lbl">T</text>

  <!-- Cracked zone note -->
  <text x="430" y="192" class="dim">(no</text>
  <text x="430" y="206" class="dim">stress)</text>

  <!-- ============================================================
       Neutral axis label (spans all three panels)
       ============================================================ -->
  <text x="25" y="126" class="na">NA</text>
  <text x="335" y="126" class="na">NA</text>

</svg>
