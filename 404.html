<div class="error-content">
  <div class="error-code">404</div>
  <p class="error-message" id="error-message">Page not found.</p>
  <p class="error-home"><a href="/">Return to tautengr.com</a></p>
  <button class="error-reload" id="error-reload" onclick="nextMessage()">another one</button>
</div>

<script>
var messages = [
  "Load path not found.",
  "This page has insufficient bearing capacity.",
  "Deflection limit exceeded. Page has moved.",
  "Section modulus insufficient for requested content.",
  "Moment connection failed. Page rotated out of bounds.",
  "Anchor bolt pullout. This page has left the building.",
  "Factor of safety against page existing: 0.00.",
  "Soil bearing pressure exceeded. Page has settled.",
  "Unsupported span. No content within reach.",
  "Shear failure along this URL."
];
var current = 0;
function nextMessage() {
  current = (current + 1) % messages.length;
  var el = document.getElementById("error-message");
  el.style.opacity = "0";
  setTimeout(function() {
    el.textContent = messages[current];
    el.style.opacity = "1";
  }, 300);
}
document.getElementById("error-message").textContent = messages[Math.floor(Math.random() * messages.length)];
</script>
